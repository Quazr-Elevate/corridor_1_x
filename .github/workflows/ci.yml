name: CI

on:
  pull_request:
  push:
    # The development branch carries every milestone until it is merged (A-018).
    branches: [main, feat/m0-stabilise]

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # tests/conftest.py sets its own environment and a throwaway SQLite file.
      - run: python -m pytest -q
      # Production does not serve /openapi.json, so the schema is kept here.
      - name: Export the OpenAPI schema
        run: python scripts/export_openapi.py openapi.json
        env:
          DEBUG: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: backend/openapi.json

  backend-postgres:
    name: Migrations on Postgres
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cor1x
          POSTGRES_PASSWORD: cor1x
          POSTGRES_DB: cor1x
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cor1x"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://cor1x:cor1x@localhost:5432/cor1x
      FX_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt
      - name: Upgrade an empty database to head
        run: alembic upgrade head
      # 0019_business_entity is one-way by design, so it is the floor here.
      - name: Downgrade to 0019_business_entity
        run: alembic downgrade 0019_business_entity
      - name: Upgrade to head again
        run: alembic upgrade head

  frontend:
    name: Frontend typecheck, lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r backend/requirements-dev.txt
      # pip-audit has no severity filter: any known advisory fails the job.
      - name: Backend packages
        run: pip-audit -r backend/requirements.txt
      - name: Frontend packages (production only, high and critical)
        if: always()
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
