# Legacy Nixpacks config — NOT used by the current Railway service, which
# builds with Railpack (see railpack.json for the start command and
# railway.toml for deploy/healthcheck settings). Kept only as a fallback if
# the service is ever switched back to the Nixpacks builder.
#
# Root directory (per Railway service settings): backend/
# - Runs Alembic migrations on start so the Postgres schema is current.
# - DATABASE_URL (Railway Postgres) is required; postgres:// URLs are
#   coerced to asyncpg by app/core/config.py.
# - Binds to $PORT (Railway sets this automatically).

[phases.setup]
nixPkgs = ["python312", "gcc"]

[phases.install]
cmds = ["python -m venv --copies /opt/venv && . /opt/venv/bin/activate && pip install --no-cache-dir -r requirements.txt"]

[start]
cmd = ". /opt/venv/bin/activate && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
