{% extends "_layout.html" %}
{% block body %}
<p>Hi {{ first_name }},</p>
<p>We couldn't verify your business profile yet. Our reviewer left this note:</p>
<blockquote style="margin:12px 0;padding:12px 16px;background:#f6f6f4;border-left:3px solid #CEE94A;">{{ reason }}</blockquote>
<p>Update your profile and press <em>Send for verification</em> again when you're ready.</p>
<p><a href="{{ account_url }}" style="display:inline-block;padding:10px 18px;background:#CEE94A;color:#0b0b0b;text-decoration:none;border-radius:8px;font-weight:600;">Update my profile</a></p>
{% endblock %}
